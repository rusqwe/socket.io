<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket.IO Chat</title>
  <link rel="stylesheet" href="styles/main.css">
</head>

<body>

  <!-- Экран входа -->
  <div id="login-screen">
    <h1>&#x1F4AC; Socket Чат</h1>
    <input type="text" id="username-input" placeholder="Введите ваше имя" maxlength="20" autofocus>
    <button id="join-btn">Войти в чат</button>
  </div>

  <!-- Экран чата -->
  <div id="chat-screen">
    <div class="chat-header">
      <h2 id="current-room-name">Войдите в комнату</h2>
      <div class="room-tabs" id="room-tabs"></div>
      <div class="connection-status" id="connection-status">
        <span class="dot"></span>
        <span class="status-text">Подключено</span>
      </div>
      <div class="user-badge" id="user-badge"></div>
    </div>
    <div class="chat-body">
      <div class="messages-container">
        <div class="messages-area" id="messages-area"></div>
        <div class="typing-indicator" id="typing-indicator"></div>
        <div class="input-area">
          <input type="text" id="message-input" placeholder="Напишите сообщение..." maxlength="1000">
          <button id="send-btn">Отправить</button>
        </div>
      </div>
      <div class="participants-panel" id="participants-panel">
        <div class="participants-header">
          <h3>Участники</h3>
          <span class="participants-count" id="participants-count">0</span>
        </div>
        <ul class="participants-list" id="participants-list"></ul>
      </div>
    </div>
  </div>
  <audio id="notification-sound" src="notification.mp3" preload="auto"></audio>
  <script src="/socket.io/socket.io.js"></script>
  <script src="chat.js"></script>
</body>

</html>
