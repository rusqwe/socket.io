<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket.IO Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== Экран входа ===== */
    #login-screen {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
      text-align: center;
      width: 360px;
    }

    #login-screen h1 {
      margin-bottom: 24px;
      font-size: 24px;
      color: #1877f2;
    }

    #login-screen input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #dddfe2;
      border-radius: 8px;
      background: #f5f6f7;
      color: #1c1e21;
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
      transition: border-color .2s;
    }

    #login-screen input:focus {
      border-color: #1877f2;
    }

    #login-screen input::placeholder {
      color: #8c8c8c;
    }

    #login-screen button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1877f2;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }

    #login-screen button:hover {
      background: #166fe5;
    }

    /* ===== Экран чата ===== */
    #chat-screen {
      display: none;
      width: 900px;
      height: 90vh;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
      overflow: hidden;
      flex-direction: column;
    }

    /* Шапка */
    .chat-header {
      background: #1877f2;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .chat-header h2 {
      font-size: 18px;
      white-space: nowrap;
      color: #fff;
    }

    .room-tabs {
      display: flex;
      gap: 8px;
    }

    .room-tab {
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, .15);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      transition: all .2s;
    }

    .room-tab.active {
      background: #fff;
      color: #1877f2;
      font-weight: 600;
    }

    .room-tab:hover:not(.active) {
      background: rgba(255, 255, 255, .3);
    }

    .user-badge {
      background: rgba(255, 255, 255, .2);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: #fff;
      white-space: nowrap;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #fff;
    }

    .connection-status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
    }

    .connection-status.disconnected .dot {
      background: #f44336;
    }

    .room-members {
      background: rgba(255, 255, 255, .2);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: #fff;
      white-space: nowrap;
    }

    .room-members span {
      color: #ffe566;
      font-weight: 600;
    }

    /* Область сообщений */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f0f2f5;
    }

    .messages-area::-webkit-scrollbar {
      width: 6px;
    }

    .messages-area::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 3px;
    }

    .message {
      max-width: 70%;
      padding: 10px 16px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .06);
    }

    .message.own {
      align-self: flex-end;
      background: #1877f2;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.other {
      align-self: flex-start;
      background: #fff;
      border-bottom-left-radius: 4px;
    }

    .message.own .meta {
      color: rgba(255, 255, 255, .75);
    }

    .message.own .meta .username {
      color: #ffe566;
    }

    .message .meta {
      font-size: 11px;
      color: #8c8c8c;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .message .meta .username {
      color: #1877f2;
      font-weight: 600;
    }

    .message .meta .time {
      margin-left: auto;
    }

    .message .text {
      font-size: 14px;
    }

    .system-message {
      align-self: center;
      font-size: 12px;
      color: #8c8c8c;
      font-style: italic;
      padding: 4px 12px;
    }

    /* Индикатор набора */
    .typing-indicator {
      padding: 4px 24px;
      font-size: 12px;
      color: #8c8c8c;
      font-style: italic;
      height: 20px;
    }

    /* Область ввода */
    .input-area {
      padding: 16px 24px;
      background: #fff;
      border-top: 1px solid #e4e6e8;
      display: flex;
      gap: 12px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #dddfe2;
      border-radius: 8px;
      background: #f5f6f7;
      color: #1c1e21;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }

    .input-area input:focus {
      border-color: #1877f2;
    }

    .input-area input::placeholder {
      color: #8c8c8c;
    }

    .input-area button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #1877f2;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }

    .input-area button:hover {
      background: #166fe5;
    }
  </style>
</head>

<body>

  <!-- Экран входа -->
  <div id="login-screen">
    <h1>&#x1F4AC; Socket Чат</h1>
    <input type="text" id="username-input" placeholder="Введите ваше имя" maxlength="20" autofocus>
    <button id="join-btn">Войти в чат</button>
  </div>

  <!-- Экран чата -->
  <div id="chat-screen">
    <div class="chat-header">
      <h2 id="current-room-name">Войдите в комнату</h2>
      <div class="room-tabs" id="room-tabs"></div>
      <div class="connection-status" id="connection-status">
        <span class="dot"></span>
        <span class="status-text">Подключено</span>
      </div>
      <div class="room-members" id="room-members"></div>
      <div class="user-badge" id="user-badge"></div>
    </div>
    <div class="messages-area" id="messages-area"></div>
    <div class="typing-indicator" id="typing-indicator"></div>
    <div class="input-area">
      <input type="text" id="message-input" placeholder="Напишите сообщение..." maxlength="1000">
      <button id="send-btn">Отправить</button>
    </div>
  </div>
  <audio id="notification-sound" src="notification.mp3" preload="auto"></audio>
  <script src="/socket.io/socket.io.js"></script>
  <script src="chat.js"></script>
</body>

</html>
