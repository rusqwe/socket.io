<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket.IO Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== Экран входа ===== */
    #login-screen {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
      text-align: center;
      width: 360px;
    }

    #login-screen h1 {
      margin-bottom: 24px;
      font-size: 24px;
      color: #1877f2;
    }

    #login-screen input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #dddfe2;
      border-radius: 8px;
      background: #f5f6f7;
      color: #1c1e21;
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
      transition: border-color .2s;
    }

    #login-screen input:focus {
      border-color: #1877f2;
    }

    #login-screen input::placeholder {
      color: #8c8c8c;
    }

    #login-screen button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1877f2;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }

    #login-screen button:hover {
      background: #166fe5;
    }

    /* ===== Экран чата ===== */
    #chat-screen {
      display: none;
      width: 900px;
      height: 90vh;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
      overflow: hidden;
      flex-direction: column;
    }

    /* Шапка */
    .chat-header {
      background: #1877f2;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .chat-header h2 {
      font-size: 18px;
      white-space: nowrap;
      color: #fff;
    }

    .room-tabs {
      display: flex;
      gap: 8px;
    }

    .room-tab {
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, .15);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      transition: all .2s;
    }

    .room-tab.active {
      background: #fff;
      color: #1877f2;
      font-weight: 600;
    }

    .room-tab:hover:not(.active) {
      background: rgba(255, 255, 255, .3);
    }

    .user-badge {
      background: rgba(255, 255, 255, .2);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: #fff;
      white-space: nowrap;
    }

    .room-members {
      background: rgba(255, 255, 255, .2);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: #fff;
      white-space: nowrap;
    }

    .room-members span {
      color: #ffe566;
      font-weight: 600;
    }

    /* Область сообщений */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f0f2f5;
    }

    .messages-area::-webkit-scrollbar {
      width: 6px;
    }

    .messages-area::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 3px;
    }

    .message {
      max-width: 70%;
      padding: 10px 16px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .06);
    }

    .message.own {
      align-self: flex-end;
      background: #1877f2;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.other {
      align-self: flex-start;
      background: #fff;
      border-bottom-left-radius: 4px;
    }

    .message.own .meta {
      color: rgba(255, 255, 255, .75);
    }

    .message.own .meta .username {
      color: #ffe566;
    }

    .message .meta {
      font-size: 11px;
      color: #8c8c8c;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .message .meta .username {
      color: #1877f2;
      font-weight: 600;
    }

    .message .meta .time {
      margin-left: auto;
    }

    .message .text {
      font-size: 14px;
    }

    .system-message {
      align-self: center;
      font-size: 12px;
      color: #8c8c8c;
      font-style: italic;
      padding: 4px 12px;
    }

    /* Индикатор набора */
    .typing-indicator {
      padding: 4px 24px;
      font-size: 12px;
      color: #8c8c8c;
      font-style: italic;
      height: 20px;
    }

    /* Область ввода */
    .input-area {
      padding: 16px 24px;
      background: #fff;
      border-top: 1px solid #e4e6e8;
      display: flex;
      gap: 12px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #dddfe2;
      border-radius: 8px;
      background: #f5f6f7;
      color: #1c1e21;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }

    .input-area input:focus {
      border-color: #1877f2;
    }

    .input-area input::placeholder {
      color: #8c8c8c;
    }

    .input-area button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #1877f2;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }

    .input-area button:hover {
      background: #166fe5;
    }
  </style>
</head>

<body>

  <!-- Экран входа -->
  <div id="login-screen">
    <h1>&#x1F4AC; Socket Чат</h1>
    <input type="text" id="username-input" placeholder="Введите ваше имя" maxlength="20" autofocus>
    <button id="join-btn">Войти в чат</button>
  </div>

  <!-- Экран чата -->
  <div id="chat-screen">
    <div class="chat-header">
      <h2 id="current-room-name">Войдите в комнату</h2>
      <div class="room-tabs" id="room-tabs"></div>
      <div class="room-members" id="room-members"></div>
      <div class="user-badge" id="user-badge"></div>
    </div>
    <div class="messages-area" id="messages-area"></div>
    <div class="typing-indicator" id="typing-indicator"></div>
    <div class="input-area">
      <input type="text" id="message-input" placeholder="Напишите сообщение..." maxlength="1000">
      <button id="send-btn">Отправить</button>
    </div>
  </div>
  <audio id="notification-sound" src="notification.mp3" preload="auto"></audio>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const usernameInput = document.getElementById('username-input');
    const joinBtn = document.getElementById('join-btn');
    const messagesArea = document.getElementById('messages-area');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const roomTabs = document.getElementById('room-tabs');
    const currentRoomName = document.getElementById('current-room-name');
    const userBadge = document.getElementById('user-badge');
    const typingIndicator = document.getElementById('typing-indicator');
    const roomMembersEl = document.getElementById('room-members');

    let username = '';
    let currentRoom = '';
    let rooms = [];
    let typingTimer = null;
    let isTyping = false;

    const socket = io();

    // ===== Вход =====
    joinBtn.addEventListener('click', joinChat);
    usernameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') joinChat();
    });

    function joinChat() {
      username = usernameInput.value.trim();
      if (!username) {
        usernameInput.focus();
        return;
      }
      loginScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      userBadge.textContent = username;

      // Отправляем имя на сервер
      socket.emit('set-username', username);
    }

    // ===== Список комнат =====
    socket.on('rooms-list', (data) => {
      rooms = data;
      roomTabs.innerHTML = '';
      data.forEach(room => {
        const btn = document.createElement('button');
        btn.className = 'room-tab';
        btn.textContent = room.name;
        btn.addEventListener('click', () => switchRoom(room.id));
        roomTabs.appendChild(btn);
      });
    });

    // ===== Список участников =====
    socket.on('room-members', (members) => {
      if (members.length === 0) {
        roomMembersEl.textContent = '';
        return;
      }
      roomMembersEl.innerHTML = `Участники: <span>${members.join(', ')}</span>`;
    });

    function switchRoom(roomId) {
      // Покидаем предыдущую комнату
      if (currentRoom) {
        socket.emit('leave-room', currentRoom);
      }
      currentRoom = roomId;
      const room = rooms.find(r => r.id === roomId);
      currentRoomName.textContent = room ? room.name : roomId;

      // Обновляем вкладки
      document.querySelectorAll('.room-tab').forEach(tab => {
        tab.classList.toggle('active', tab.textContent === (room ? room.name : roomId));
      });

      // Очищаем сообщения
      messagesArea.innerHTML = '';

      // Подключаемся к комнате
      socket.emit('join-room', roomId);
    }

    // ===== Сообщения =====
    socket.on('chat-message', (data) => {
      if (data.room !== currentRoom) return;
      appendMessage(data.username, data.text, data.timestamp, data.username === username);
    });

    socket.on('system-message', (data) => {
      if (data.room !== currentRoom) return;
      appendSystemMessage(data.text);
    });

    function appendMessage(username, text, timestamp, isOwn) {
      const div = document.createElement('div');
      div.className = `message ${isOwn ? 'own' : 'other'}`;
      
      let metaHTML = '';
      metaHTML += `<span class="username">${escapeHTML(username)}</span>`;
      if (timestamp) {
        const date = new Date(timestamp);
        const time = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        metaHTML += `<span class="time">${time}</span>`;
      }
      if (metaHTML) {
        metaHTML = `<div class="meta">${metaHTML}</div>`;
      }

      div.innerHTML = metaHTML + `<div class="text">${escapeHTML(text)}</div>`;
      messagesArea.appendChild(div);
      messagesArea.scrollTop = messagesArea.scrollHeight;
      if(!isOwn) document.getElementById('notification-sound').play();
    }

    function appendSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'system-message';
      div.textContent = text;
      messagesArea.appendChild(div);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    // ===== Отправка сообщения =====
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !currentRoom) return;
      socket.emit('chat-message', { room: currentRoom, text });
      messageInput.value = '';
      messageInput.focus();
      socket.emit('stop-typing', { room: currentRoom });
      isTyping = false;
    }

    // ===== Индикатор набора =====
    messageInput.addEventListener('input', () => {
      if (!currentRoom) return;
      if (!isTyping) {
        socket.emit('typing', { room: currentRoom });
        isTyping = true;
      }
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        socket.emit('stop-typing', { room: currentRoom });
        isTyping = false;
      }, 2000);
    });

    socket.on('user-typing', (data) => {
      if (data.room !== currentRoom) return;
      typingIndicator.textContent = `${data.username} печатает...`;
    });

    socket.on('user-stop-typing', (data) => {
      if (data.room !== currentRoom) return;
      typingIndicator.textContent = '';
    });

    // ===== Событие выхода из комнаты =====
    socket.on('leave-room', (roomId) => {
      if (roomId === currentRoom) {
        messagesArea.innerHTML = '';
      }
    });

    // ===== Вспомогательные функции =====
    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>

</html>
